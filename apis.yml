name: Wi Charge
description: >-
  Wi-Charge is a long-range wireless power company that transmits electricity
  over the air using infrared light, delivering safe, automatic charging to
  smart devices from thirty or more feet away without cables, batteries, or
  charging pads. The company sells consumer products such as the Encode Wireless
  Power Kit for smart locks and licenses its transmitter platform and compact
  receiver modules to OEMs building smart-home, commercial, IoT, retail, and
  consumer-electronics devices. Wi-Charge is venture-backed, including by
  Lightspeed Venture Partners. This profile was surfaced as a portfolio-company
  lead and enriched by the API Evangelist pipeline; as of this pass Wi-Charge
  publishes no public developer API, SDK, or developer portal — it is a hardware
  and OEM-licensing business rather than an API-first provider.
